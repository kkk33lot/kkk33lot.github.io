<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快乐不知时日 - Dear Jane</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      color: #ffffff;
    }

    /* 手机外框 */
    .music-phone-frame {
      width: 100%;
      max-width: 360px;
      background: #121318;
      border-radius: 40px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
      padding: 14px 18px 24px;
      position: relative;
    }

    /* 顶部状态栏 */
    .music-phone-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
      padding: 2px 4px 0;
    }

    .music-dynamic-island {
      width: 90px;
      height: 22px;
      background: #000000;
      border-radius: 20px;
    }

    /* 黑胶唱片区域 */
    .music-turntable-box {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto 16px;
      background: #181920;
      border-radius: 24px;
      box-shadow: inset 0 0 20px #000000, 0 10px 25px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-tonearm {
      position: absolute;
      top: 10px;
      right: 22px;
      width: 50px;
      height: 80px;
      border-right: 3px solid #999999;
      border-top: 3px solid #999999;
      border-top-right-radius: 12px;
      transform: rotate(15deg);
      transform-origin: top right;
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-tonearm.playing {
      transform: rotate(27deg);
    }

    .music-vinyl-record {
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2e36 0%, #141519 60%, #070709 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #22232b;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.9);
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-vinyl-record.spinning {
      animation: spinVinyl 14s linear infinite;
    }

    .music-record-cover {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #000000;
      object-fit: cover;
    }

    /* 标题与红心 */
    .music-song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .music-song-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .music-heart-tag {
      color: #ff3b30;
      font-size: 13px;
      font-weight: 600;
    }

    /* 歌手名与标签 */
    .music-artist-line {
      display: flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .music-artist-name {
      font-size: 13px;
      color: #8e8e93;
      margin-right: 8px;
    }

    .music-badge-group {
      display: flex;
      gap: 4px;
    }

    .music-badge {
      border: 1px solid #3a3b45;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      color: #7c7c88;
    }

    /* 歌词区域容器 (固定高度，平滑过度) */
    .music-lyrics-box {
      margin: 10px 0 16px;
      padding: 0 4px;
      height: 28px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    /* 逐字变色歌词样式 */
    .music-lyric-line {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(
        to right,
        #ffffff var(--lyric-progress, 0%),
        #666666 var(--lyric-progress, 0%)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      transition: opacity 0.3s ease;
    }

    /* 功能按钮栏 */
    .music-icon-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8e8e93;
      font-size: 12px;
      margin-bottom: 16px;
      padding: 0 6px;
    }

    /* 进度条样式 */
    .music-progress-container {
      padding: 0 4px;
      margin-bottom: 14px;
      cursor: pointer;
    }

    .music-progress-bar {
      width: 100%;
      height: 3px;
      background: #2a2b34;
      position: relative;
      margin-bottom: 6px;
      border-radius: 2px;
    }

    .music-progress-current {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    .music-progress-dot {
      position: absolute;
      top: -3px;
      left: 0%;
      width: 9px;
      height: 9px;
      background: #ffffff;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .music-time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666666;
    }

    /* 底部控制栏 */
    .music-controls-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
      margin-top: 6px;
    }

    .music-ctrl-icon {
      font-size: 20px;
      color: #a0a5b5;
      cursor: pointer;
      user-select: none;
      transition: opacity 0.2s;
    }

    .music-ctrl-icon:active {
      opacity: 0.5;
    }

    /* 中央圆圈播放/暂停按钮 */
    .music-play-btn-box {
      width: 52px;
      height: 52px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 20px;
      cursor: pointer;
      user-select: none;
      padding-left: 3px;
      transition: transform 0.15s ease, background-color 0.2s;
    }

    .music-play-btn-box:active {
      transform: scale(0.92);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .music-phone-home-indicator {
      width: 130px;
      height: 4px;
      background: #ffffff;
      border-radius: 2px;
      margin: 18px auto 0;
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <div class="music-phone-frame">
    <div class="music-phone-status-bar">
      <span>08:3
