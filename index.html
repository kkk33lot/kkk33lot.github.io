<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>快乐不知时日 - Dear Jane</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", sans-serif;
      color: #ffffff;
    }

    /* 手机外框 */
    .music-phone-frame {
      width: 340px;
      background: #121318;
      border-radius: 36px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
      padding: 16px;
      position: relative;
    }

    /* 顶部状态栏 */
    .music-phone-status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      padding: 0 4px;
    }

    .music-dynamic-island {
      width: 80px;
      height: 20px;
      background: #000000;
      border-radius: 20px;
    }

    /* 黑胶唱片区域 */
    .music-turntable-box {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto 16px;
      background: #181920;
      border-radius: 20px;
      box-shadow: inset 0 0 15px #000000, 0 8px 20px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .music-tonearm {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 45px;
      height: 75px;
      border-right: 3px solid #999999;
      border-top: 3px solid #999999;
      border-top-right-radius: 12px;
      transform: rotate(15deg);
      transform-origin: top right;
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .music-tonearm.playing {
      transform: rotate(27deg);
    }

    .music-vinyl-record {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, #2d2e36 0%, #141519 60%, #070709 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 3px solid #22232b;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
    }

    @keyframes spinVinyl {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .music-vinyl-record.spinning {
      animation: spinVinyl 14s linear infinite;
    }

    .music-record-cover {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid #000000;
      object-fit: cover;
    }

    /* 标题与红心 */
    .music-song-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .music-song-title {
      font-size: 20px;
      font-weight: 700;
    }

    .music-heart-tag {
      color: #ff3b30;
      font-size: 12px;
      font-weight: 600;
    }

    /* 歌手名与标签 */
    .music-artist-line {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .music-artist-name {
      font-size: 13px;
      color: #8e8e93;
      margin-right: 8px;
    }

    .music-badge-group {
      display: flex;
      gap: 4px;
    }

    .music-badge {
      border: 1px solid #3a3b45;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 10px;
      color: #7c7c88;
    }

    /* 歌词区域 */
    .music-lyrics-box {
      margin: 8px 0 14px;
      padding: 0 4px;
      height: 24px;
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .music-lyric-line {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      background: linear-gradient(
        to right,
        #ffffff var(--lyric-progress, 0%),
        #666666 var(--lyric-progress, 0%)
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      transition: opacity 0.3s ease;
    }

    /* 功能图标栏 */
    .music-icon-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #8e8e93;
      font-size: 12px;
      margin-bottom: 14px;
      padding: 0 6px;
    }

    /* 进度条 */
    .music-progress-container {
      padding: 0 4px;
      margin-bottom: 12px;
      cursor: pointer;
    }

    .music-progress-bar {
      width: 100%;
      height: 3px;
      background: #2a2b34;
      position: relative;
      margin-bottom: 6px;
      border-radius: 2px;
    }

    .music-progress-current {
      width: 0%;
      height: 100%;
      background: #ffffff;
      border-radius: 2px;
    }

    .music-progress-dot {
      position: absolute;
      top: -3px;
      left: 0%;
      width: 9px;
      height: 9px;
      background: #ffffff;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .music-time-stamps {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #666666;
    }

    /* 控制按钮栏 */
    .music-controls-wrapper {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 6px;
    }

    .music-ctrl-icon {
      font-size: 18px;
      color: #a0a5b5;
      cursor: pointer;
      user-select: none;
    }

    .music-play-btn-box {
      width: 48px;
      height: 48px;
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      padding-left: 3px;
    }

    .music-phone-home-indicator {
      width: 120px;
      height: 4px;
      background: #ffffff;
      border-radius: 2px;
      margin: 14px auto 0;
      opacity: 0.35;
    }
  </style>
</head>
<body>

  <div class="music-phone-frame">
    <div class="music-phone-status-bar">
      <span>08:30</span>
      <div class="music-dynamic-island"></div>
      <span>5G 🔋</span>
    </div>

    <div class="music-player-body">
      <div class="music-turntable-box">
        <div class="music-tonearm" id="tonearm"></div>
        <div class="music-vinyl-record" id="vinyl">
          <img class="music-record-cover" src="https://i.imgur.com/xYul2TG.jpeg" alt="Album Cover">
        </div>
      </div>

      <div class="music-song-header">
        <h3 class="music-song-title">快乐不知时日</h3>
        <span class="music-heart-tag">❤️ 500w+</span>
      </div>

      <div class="music-artist-line">
        <span class="music-artist-name">Dear Jane</span>
        <div class="music-badge-group">
          <span class="music-badge">5k人</span>
          <span class="music-badge">VIP</span>
          <span class="music-badge">HQ</span>
        </div>
      </div>

      <div class="music-lyrics-box">
        <span class="music-lyric-line" id="lyricLine" style="--lyric-progress: 40%;">记住每分钟</span>
      </div>

      <div class="music-icon-bar">
        <span>🎤 99+</span>
        <span>🎧 off</span>
        <span>📥</span>
        <span>💬 1w+</span>
        <span>⋮</span>
      </div>

      <div class="music-progress-container" id="progressArea">
        <div class="music-progress-bar">
          <div class="music-progress-current" id="progressCurrent"></div>
          <div class="music-progress-dot" id="progressDot"></div>
        </div>
        <div class="music-time-stamps">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:00</span>
        </div>
      </div>

      <div class="music-controls-wrapper">
        <span class="music-ctrl-icon">🔁</span>
        <span class="music-ctrl-icon">⏮</span>
        
        <div class="music-play-btn-box" id="playBtn">▶</div>
        
        <span class="music-ctrl-icon">⏭</span>
        <span class="music-ctrl-icon">☰</span>
      </div>
    </div>

    <div class="music-phone-home-indicator"></div>
  </div>

  <audio id="audioPlayer" src="https://ia601601.us.archive.org/21/items/lyhsun/time-flies_%28cut%29.mp3" preload="metadata"></audio>

  <script>
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const vinyl = document.getElementById('vinyl');
    const tonearm = document.getElementById('tonearm');
    const progressCurrent = document.getElementById('progressCurrent');
    const progressDot = document.getElementById('progressDot');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const progressArea = document.getElementById('progressArea');
    const lyricLine = document.getElementById('lyricLine');

    const lyricsData = [
      { start: 0, end: 3.5, text: "记住每分钟", initProgress: 40 },
      { start: 3.5, end: 7.0, text: "明天需要什么", initProgress: 0 },
      { start: 7.0, end: 10.5, text: "有着你便可", initProgress: 0 },
      { start: 10.5, end: 15.0, text: "快乐不知时日过", initProgress: 0 }
    ];

    let currentLyricIndex = -1;

    function formatTime(seconds) {
      if (isNaN(seconds)) return "00:00";
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
    }

    playBtn.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playBtn.textContent = '❚❚';
        playBtn.style.paddingLeft = '0px';
        vinyl.classList.add('spinning');
        tonearm.classList.add('playing');
      } else {
        audio.pause();
        playBtn.textContent = '▶';
        playBtn.style.paddingLeft = '3px';
        vinyl.classList.remove('spinning');
        tonearm.classList.remove('playing');
      }
    });

    audio.addEventListener('timeupdate', () => {
      if (!audio.duration) return;

      const currTime = audio.currentTime;

      const pct = (currTime / audio.duration) * 100;
      progressCurrent.style.width = pct + '%';
      progressDot.style.left = pct + '%';
      currentTimeEl.textContent = formatTime(currTime);
      durationTimeEl.textContent = formatTime(audio.duration);

      let matchIndex = lyricsData.findIndex(item => currTime >= item.start && currTime < item.end);

      if (matchIndex === -1 && currTime >= lyricsData[lyricsData.length - 1].end) {
        matchIndex = lyricsData.length - 1;
      }

      if (matchIndex !== -1) {
        const item = lyricsData[matchIndex];

        if (currentLyricIndex !== matchIndex) {
          currentLyricIndex = matchIndex;
          lyricLine.style.opacity = '0';
          setTimeout(() => {
            lyricLine.textContent = item.text;
            lyricLine.style.opacity = '1';
          }, 150);
        }

        let lineProgress = 0;
        if (matchIndex === 0 && currTime === 0) {
          lineProgress = item.initProgress;
        } else {
          const lineDuration = item.end - item.start;
          const elapsed = currTime - item.start;
          lineProgress = Math.min(100, Math.max(0, (elapsed / lineDuration) * 100));
          if (matchIndex === 0) {
            lineProgress = 40 + (lineProgress * 0.6);
          }
        }

        lyricLine.style.setProperty('--lyric-progress', `${lineProgress}%`);
      }
    });

    audio.addEventListener('loadedmetadata', () => {
      durationTimeEl.textContent = formatTime(audio.duration);
    });

    audio.addEventListener('ended', () => {
      playBtn.textContent = '▶';
      playBtn.style.paddingLeft = '3px';
      vinyl.classList.remove('spinning');
      tonearm.classList.remove('playing');
      progressCurrent.style.width = '0%';
      progressDot.style.left = '0%';
      
      currentLyricIndex = 0;
      lyricLine.textContent = lyricsData[0].text;
      lyricLine.style.setProperty('--lyric-progress', '40%');
    });

    progressArea.addEventListener('click', (e) => {
      if (!audio.duration) return;
      const rect = progressArea.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;
      audio.currentTime = (clickX / width) * audio.duration;
    });
  </script>
</body>
</html>
