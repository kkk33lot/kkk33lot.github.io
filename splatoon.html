<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Splatoon 3 Gacha Animation & Exporter</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    #canvas-container {
  position: relative;
  width: 600px;
  height: 600px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  border-radius: 16px;
  overflow: hidden;
  /* 替换原来的暗黑色，改用斯普拉遁风的深紫青色渐变 + 炫光底色 */
  background: radial-gradient(circle at 50% 40%, #2e3856 0%, #161b2b 60%, #0a0d14 100%);
}

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .controls {
      margin-top: 15px;
      display: flex;
      gap: 12px;
      z-index: 10;
    }

    button {
      background: #f59e0b;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      font-size: 14px;
    }

    button:hover {
      background: #fbbf24;
      transform: scale(1.05);
    }

    button:disabled {
      background: #555;
      color: #888;
      cursor: not-allowed;
      transform: none;
    }

    #status {
      margin-top: 8px;
      font-size: 13px;
      color: #aaa;
    }
  </style>

  <!-- Three.js & GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="controls">
    <button id="btn-play">▶ 播放动画</button>
    <button id="btn-record">🔴 录制并下载 WebM 视频</button>
  </div>
  <div id="status">点击“播放”观看效果，或点击“录制”生成可用于转 GIF 的文件</div>

  <script>
    // --- 1. Scene & Renderer Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.set(0, 0, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setSize(600, 600);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    // --- 2. Lights ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 1.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffb700, 2, 10);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // --- 3. 3D Objects Construction ---
    const gachaGroup = new THREE.Group();
    scene.add(gachaGroup);

    // Gold Material
    const goldMaterial = new THREE.MeshStandardMaterial({
      color: 0xf59e0b,
      metalness: 0.8,
      roughness: 0.2,
      envMapIntensity: 1.0
    });

    // Top Shell (Upper Half)
    const topGeo = new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2);
    const topShell = new THREE.Mesh(topGeo, goldMaterial);

    // Bottom Shell (Lower Half)
    const botGeo = new THREE.SphereGeometry(1.2, 32, 16, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
    const botShell = new THREE.Mesh(botGeo, goldMaterial);

    gachaGroup.add(topShell);
    gachaGroup.add(botShell);

    // Particles (Glowing Sparkles)
    const particleCount = 60;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    const particleVel = [];

    for (let i = 0; i < particleCount; i++) {
      particlePos[i * 3] = 0;
      particlePos[i * 3 + 1] = 0;
      particlePos[i * 3 + 2] = 0;

      particleVel.push({
        x: (Math.random() - 0.5) * 0.15,
        y: (Math.random() - 0.5) * 0.15,
        z: (Math.random() - 0.5) * 0.15
      });
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xffffff,
      size: 0.12,
      transparent: true,
      opacity: 0
    });
    const particleSystem = new THREE.Points(particleGeo, particleMat);
    scene.add(particleSystem);

    // Gold Nameplate (3D Mesh)
    const plateGeo = new THREE.BoxGeometry(2.4, 0.8, 0.05);
    const plateMat = new THREE.MeshStandardMaterial({
      color: 0xfcb005,
      metalness: 0.9,
      roughness: 0.1
    });
    const nameplate = new THREE.Mesh(plateGeo, plateMat);
    nameplate.scale.set(0, 0, 0);
    scene.add(nameplate);

    // --- 4. Animation Sequence (GSAP) ---
    let animTimeline = null;

    function resetScene() {
      topShell.position.set(0, 0, 0);
      botShell.position.set(0, 0, 0);
      topShell.rotation.set(0, 0, 0);
      botShell.rotation.set(0, 0, 0);
      gachaGroup.rotation.set(0, 0, 0);
      gachaGroup.scale.set(1, 1, 1);
      gachaGroup.visible = true;

      nameplate.scale.set(0, 0, 0);
      nameplate.rotation.set(0, 0, 0);

      particleMat.opacity = 0;
      const positions = particleSystem.geometry.attributes.position.array;
      for (let i = 0; i < particleCount; i++) {
        positions[i * 3] = 0;
        positions[i * 3 + 1] = 0;
        positions[i * 3 + 2] = 0;
      }
      particleSystem.geometry.attributes.position.needsUpdate = true;
    }

    function playAnimation() {
      resetScene();

      animTimeline = gsap.timeline();

      // Phase 1: Rapid 3D Rotation & Tremble
      animTimeline.to(gachaGroup.rotation, { y: Math.PI * 4, x: 0.4, duration: 0.8, ease: "power2.in" })
        .to(gachaGroup.scale, { x: 1.2, y: 1.2, z: 1.2, duration: 0.2, yoyo: true, repeat: 1 })
        
      // Phase 2: Shell Split & Burst
      .to(topShell.position, { y: 1.8, z: -0.5, duration: 0.5, ease: "back.out(1.7)" }, "burst")
      .to(botShell.position, { y: -1.8, z: -0.5, duration: 0.5, ease: "back.out(1.7)" }, "burst")
      .to(topShell.rotation, { x: -0.5, duration: 0.5 }, "burst")
      .to(botShell.rotation, { x: 0.5, duration: 0.5 }, "burst")
      .to(particleMat, { opacity: 1, duration: 0.1 }, "burst")
      
      // Phase 3: Particles Explode Outward
      .to({}, {
        duration: 0.6,
        onUpdate: () => {
          const positions = particleSystem.geometry.attributes.position.array;
          for (let i = 0; i < particleCount; i++) {
            positions[i * 3] += particleVel[i].x;
            positions[i * 3 + 1] += particleVel[i].y;
            positions[i * 3 + 2] += particleVel[i].z;
          }
          particleSystem.geometry.attributes.position.needsUpdate = true;
        }
      }, "burst")
      .to(particleMat, { opacity: 0, duration: 0.4 }, "burst+=0.3")

      // Phase 4: Nameplate Flip Reveal
      .to(gachaGroup.scale, { x: 0, y: 0, z: 0, duration: 0.3 }, "reveal")
      .to(nameplate.scale, { x: 1, y: 1, z: 1, duration: 0.6, ease: "elastic.out(1, 0.5)" }, "reveal")
      .to(nameplate.rotation, { y: Math.PI * 2, duration: 0.8, ease: "power2.out" }, "reveal");
    }

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();

    // --- 5. Controls & Video Recorder ---
    document.getElementById('btn-play').addEventListener('click', playAnimation);

    // MediaRecorder for Canvas Video Export
    let mediaRecorder;
    let recordedChunks = [];

    document.getElementById('btn-record').addEventListener('click', () => {
      const btnRecord = document.getElementById('btn-record');
      const status = document.getElementById('status');
      
      const stream = renderer.domElement.captureStream(30); // 30 FPS
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });

      recordedChunks = [];
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'splatoon-gacha.webm';
        a.click();
        
        btnRecord.disabled = false;
        status.innerText = "录制完成！WebM 文件已自动下载。";
      };

      btnRecord.disabled = true;
      status.innerText = "录制中...";
      
      mediaRecorder.start();
      playAnimation();

      // Stop recording after 3 seconds (animation duration)
      setTimeout(() => {
        mediaRecorder.stop();
      }, 2800);
    });
  </script>
</body>
</html>
